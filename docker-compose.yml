services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: drivetec, POSTGRES_USER: drivetec, POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivetec -d drivetec"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgres://drivetec:${DB_PASSWORD}@db:5432/drivetec"}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes: {pgdata: {}}
